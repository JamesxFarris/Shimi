<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Cyan to Magenta gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff"/>
      <stop offset="100%" style="stop-color:#ff00aa"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Dark background -->
  <rect width="100" height="100" rx="12" fill="#0a0a0f"/>
  <!-- Border glow -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="none" stroke="url(#neonGrad)" stroke-width="2" opacity="0.6"/>
  <!-- // slashes -->
  <text x="12" y="68" font-size="32" fill="#00f0ff" font-family="monospace" font-weight="bold" filter="url(#glow)" opacity="0.8">//</text>
  <!-- S letter -->
  <text x="40" y="72" font-size="55" fill="url(#neonGrad)" font-family="Arial Black, sans-serif" font-weight="bold" filter="url(#glow)">S</text>
</svg>
